<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mud Buggin LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C41E2A;
    --red-dark:#9A171F;
    --black:#1A1A1A;
    --gold:#F2B705;
    --cream:#FAF6EF;
    --water:#243336;
    --water-light:#33484C;
    --rope:#D8CBB0;
    --rope-dark:#B7A780;
    --ok:#2E7D4F;
    --unpaid:#B7481C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream);
    color:var(--black);
  }
  h1,h2,h3,.brandtype{
    font-family:'Oswald',sans-serif;
    letter-spacing:0.02em;
    margin:0;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--water);
  }
  .login-card{
    background:var(--cream);
    border-radius:4px;
    padding:40px 36px;
    width:320px;
    text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,0.35);
  }
  .login-card img{width:88px;height:88px;margin-bottom:14px;}
  .login-card h1{font-size:22px;color:var(--red);}
  .login-card p.sub{margin:4px 0 22px;color:var(--water-light);font-size:13px;}
  .login-card input{
    width:100%;
    padding:10px 12px;
    margin-bottom:10px;
    border:1px solid var(--rope-dark);
    border-radius:3px;
    font-size:14px;
  }
  .login-card button{
    width:100%;
    padding:11px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:3px;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    letter-spacing:0.03em;
  }
  .login-card button:hover{background:var(--red-dark);}
  #login-error{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;}
  #login-config-note{font-size:11px;color:var(--water-light);margin-top:18px;line-height:1.5;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;}
  #app.visible{display:flex;}

  #sidebar{
    width:220px;
    background:var(--water);
    color:var(--cream);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:22px 18px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .brand img{width:40px;height:40px;}
  .brand .name{font-family:'Oswald',sans-serif;font-size:16px;line-height:1.15;color:#fff;}
  .brand .name span{display:block;font-size:10px;color:var(--gold);letter-spacing:0.08em;}

  nav{padding:14px 0;flex:1;}
  nav a{
    display:block;
    padding:11px 22px;
    color:var(--cream);
    text-decoration:none;
    font-size:14px;
    border-left:3px solid transparent;
    opacity:0.75;
  }
  nav a:hover{opacity:1;background:rgba(255,255,255,0.05);}
  nav a.active{
    opacity:1;
    border-left-color:var(--gold);
    background:rgba(255,255,255,0.07);
    font-weight:600;
  }
  #logout-btn{
    margin:14px 18px 20px;
    padding:9px;
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:var(--cream);
    border-radius:3px;
    font-size:12px;
  }
  #logout-btn:hover{border-color:var(--gold);color:var(--gold);}

  #main{flex:1;padding:32px 40px;max-width:1100px;}
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:6px;
  }
  .page-head h1{font-size:26px;color:var(--black);}
  .page-head-bar{height:4px;background:var(--red);width:56px;margin-bottom:26px;}

  .btn{
    display:inline-block;
    padding:9px 16px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:3px;
    font-size:13px;
    font-weight:600;
  }
  .btn:hover{background:var(--red-dark);}
  .btn.secondary{background:transparent;color:var(--water);border:1px solid var(--rope-dark);}
  .btn.secondary:hover{border-color:var(--water);}
  .btn.small{padding:5px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--water-light);
    padding:8px 10px;
    border-bottom:2px solid var(--rope-dark);
  }
  td{padding:10px 10px;border-bottom:1px solid var(--rope);font-size:14px;}
  tr:hover td{background:rgba(196,30,42,0.04);}

  .status-pill{
    display:inline-block;
    padding:3px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
  }
  .status-unpaid{background:rgba(183,72,28,0.14);color:var(--unpaid);}
  .status-paid{background:rgba(46,125,79,0.14);color:var(--ok);}
  .status-delivered{background:rgba(51,72,76,0.12);color:var(--water);}
  .status-invoiced{background:rgba(242,183,5,0.2);color:#8a6600;}

  .panel{
    background:#fff;
    border:1px solid var(--rope);
    border-radius:4px;
    padding:22px;
    margin-top:18px;
    max-width:640px;
  }
  .panel h3{font-size:15px;margin-bottom:14px;color:var(--black);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--water-light);margin-bottom:4px;}
  .field input,.field select,.field textarea{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--rope-dark);
    border-radius:3px;
    font-size:14px;
    font-family:inherit;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .sack-row{display:grid;grid-template-columns:70px 1fr 32px;gap:8px;align-items:center;margin-bottom:6px;}
  .sack-row span{font-size:12px;color:var(--water-light);}
  .sack-remove{background:transparent;border:none;color:var(--red);font-size:16px;}

  .total-line{
    display:flex;
    justify-content:space-between;
    padding-top:10px;
    margin-top:10px;
    border-top:1px solid var(--rope);
    font-family:'Oswald',sans-serif;
    font-size:16px;
  }
  .total-line .amt{color:var(--red);}

  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--water-light);
    border:1px dashed var(--rope-dark);
    border-radius:4px;
    margin-top:10px;
  }

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:8px;}
  .stat-card{background:#fff;border:1px solid var(--rope);border-radius:4px;padding:18px;}
  .stat-card .label{font-size:12px;color:var(--water-light);margin-bottom:6px;}
  .stat-card .value{font-family:'Oswald',sans-serif;font-size:26px;color:var(--red);}

  #toast{
    position:fixed;bottom:24px;right:24px;
    background:var(--water);color:#fff;
    padding:12px 18px;border-radius:4px;
    font-size:13px;display:none;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
  }

  /* Printable invoice */
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:30px;}
  }
  .inv-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--red);padding-bottom:16px;margin-bottom:20px;}
  .inv-head img{width:60px;height:60px;}
  .inv-head h2{font-size:20px;color:var(--red);}
  .inv-meta{text-align:right;font-size:13px;}
  .inv-table{width:100%;border-collapse:collapse;margin:16px 0;}
  .inv-table th,.inv-table td{border:1px solid var(--rope-dark);padding:8px;font-size:13px;text-align:left;}
  .inv-total{text-align:right;font-family:'Oswald',sans-serif;font-size:20px;margin-top:10px;}

  @media (max-width:800px){
    #app.visible{flex-direction:column;}
    #sidebar{width:100%;min-height:auto;flex-direction:row;overflow-x:auto;}
    .brand{border-bottom:none;}
    nav{display:flex;padding:0;}
    nav a{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
    nav a.active{border-left:none;border-bottom-color:var(--gold);}
    #main{padding:22px 18px;}
    .stat-grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://rufbtrooanmqknhugvxi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1ZmJ0cm9vYW5tcWtuaHVndnhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTk1MDYsImV4cCI6MjEwMzk3NTUwNn0.Cn0OVXWcM6Bktdg_lWZKu-BIKcxe8UBo1qJ5N6pfV4Q";

/* ================= AUTH / SB WRAPPER ================= */
function getSession(){
  const raw = localStorage.getItem('mb_session');
  return raw ? JSON.parse(raw) : null;
}
function setSession(s){ localStorage.setItem('mb_session', JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem('mb_session'); }

async function handleLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter email and password.'; return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error_description || data.msg || 'Login failed.'; return; }
    setSession({ access_token: data.access_token, refresh_token: data.refresh_token, email });
    boot();
  }catch(e){
    errEl.textContent = 'Could not reach Supabase. Check SUPABASE_URL.';
  }
}
function handleLogout(){
  clearSession();
  location.reload();
}

async function sb(path, options = {}){
  const session = getSession();
  const headers = Object.assign({
    'Content-Type':'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${session ? session.access_token : SUPABASE_ANON_KEY}`
  }, options.headers || {});
  if(options.prefer){ headers['Prefer'] = options.prefer; }
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, Object.assign({}, options, { headers }));
  if(res.status === 401){ clearSession(); location.reload(); return null; }
  if(!res.ok){
    const text = await res.text();
    throw new Error(`Request failed (${res.status}): ${text}`);
  }
  const text = await res.text();
  if(!text) return null;
  try { return JSON.parse(text); } catch(e){ return null; }
}

/* ================= TOAST ================= */
function toast(msg, isError){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isError ? 'var(--unpaid)' : 'var(--water)';
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 3200);
}

/* ================= ROUTER ================= */
const routes = { dashboard: renderDashboard, clients: renderClients, pickups: renderPickups, deliveries: renderDeliveries, invoices: renderInvoices, schedule: renderSchedule };

function currentRoute(){
  return (location.hash || '#dashboard').slice(1);
}
function navigate(){
  const route = currentRoute();
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.route === route));
  const fn = routes[route] || renderDashboard;
  fn();
}
window.addEventListener('hashchange', navigate);

/* ================= BOOT ================= */
function boot(){
  const session = getSession();
  if(session){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    navigate();
    refreshScheduleBadge();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').classList.remove('visible');
  }
}

async function refreshScheduleBadge(){
  try{
    const pending = await sb('order_requests?select=id&status=eq.pending');
    const badge = document.getElementById('schedule-badge');
    if(pending && pending.length){
      badge.textContent = pending.length;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  }catch(e){ /* quiet fail — badge just won't show */ }
}

/* ================= DASHBOARD ================= */
async function renderDashboard(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page-head"><h1>Dashboard</h1></div><div class="page-head-bar"></div>
    <div class="stat-grid" id="stat-grid"><div class="empty-state">Loading…</div></div>`;
  try{
    const [deliveries, invoices, pickups, pendingOrders] = await Promise.all([
      sb('deliveries?select=id,delivery_date&order=delivery_date.desc'),
      sb('invoices?select=id,total_amount,status'),
      sb('pickups?select=id,pickup_date&order=pickup_date.desc&limit=30'),
      sb('order_requests?select=id&status=eq.pending')
    ]);
    const unpaidTotal = invoices.filter(i => i.status === 'unpaid').reduce((s,i)=>s+Number(i.total_amount),0);
    const thisMonth = new Date().toISOString().slice(0,7);
    const deliveriesThisMonth = deliveries.filter(d => d.delivery_date.startsWith(thisMonth)).length;
    const pickupsThisMonth = pickups.filter(p => p.pickup_date.startsWith(thisMonth)).length;
    const pendingCount = pendingOrders.length;
    document.getElementById('stat-grid').innerHTML = `
      <div class="stat-card" style="${pendingCount ? 'border-color:var(--gold);border-width:2px;cursor:pointer;' : ''}" ${pendingCount ? `onclick="location.hash='#schedule'"` : ''}>
        <div class="label">${pendingCount ? 'New Order Requests' : 'Order Requests'}</div>
        <div class="value" style="${pendingCount ? 'color:#8a6600;' : ''}">${pendingCount}</div>
      </div>
      <div class="stat-card"><div class="label">Unpaid Invoices</div><div class="value">$${unpaidTotal.toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">Deliveries This Month</div><div class="value">${deliveriesThisMonth}</div></div>
      <div class="stat-card"><div class="label">Pickups This Month</div><div class="value">${pickupsThisMonth}</div></div>
    `;
  }catch(e){
    document.getElementById('stat-grid').innerHTML = `<div class="empty-state">Couldn't load stats. ${e.message}</div>`;
  }
}

/* ================= CLIENTS ================= */
async function renderClients(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-head"><h1>Clients</h1><button class="btn" onclick="showClientForm()">Add Client</button></div>
    <div class="page-head-bar"></div>
    <div id="client-form-slot"></div>
    <table><thead><tr><th>Business</th><th>Contact</th><th>Phone</th><th>$/lb</th><th>Lead Time</th><th></th></tr></thead>
    <tbody id="clients-tbody"><tr><td colspan="6">Loading…</td></tr></tbody></table>
  `;
  const clients = await sb('clients?select=*&order=business_name.asc');
  const tbody = document.getElementById('clients-tbody');
  if(!clients.length){ tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">No clients yet. Add your first one above.</div></td></tr>`; return; }
  tbody.innerHTML = clients.map(c => `
    <tr>
      <td><strong>${escapeHtml(c.business_name)}</strong></td>
      <td>${escapeHtml(c.contact_name || '—')}</td>
      <td>${escapeHtml(c.phone || '—')}</td>
      <td>$${Number(c.price_per_lb).toFixed(2)}</td>
      <td>${c.lead_time_hours}h</td>
      <td>
        <button class="btn small secondary" onclick="showClientForm('${c.id}')">Edit</button>
        <button class="btn small" style="background:transparent;color:var(--unpaid);border:1px solid var(--unpaid);margin-left:6px;" onclick="deleteClient('${c.id}', '${escapeHtml(c.business_name).replace(/'/g, "\\'")}')">Delete</button>
      </td>
    </tr>
  `).join('');
  window._clientsCache = clients;
}

async function deleteClient(id, name){
  const hasDeliveries = await sb(`deliveries?client_id=eq.${id}&select=id&limit=1`);
  if(hasDeliveries && hasDeliveries.length){
    toast(`Can't delete ${name} — they have delivery/invoice history. Consider editing their info instead, or removing their deliveries first if this was a mistake.`, true);
    return;
  }
  if(!confirm(`Delete ${name}? This can't be undone.`)) return;
  try{
    await sb(`clients?id=eq.${id}`, { method:'DELETE' });
    toast('Client deleted.');
    renderClients();
  }catch(e){ toast('Delete failed: ' + e.message, true); }
}

function showClientForm(id){
  const existing = id ? (window._clientsCache || []).find(c => c.id === id) : null;
  const slot = document.getElementById('client-form-slot');
  slot.innerHTML = `
    <div class="panel">
      <h3>${existing ? 'Edit Client' : 'New Client'}</h3>
      <div class="row2">
        <div class="field"><label>Business Name</label><input id="cf-business" value="${existing ? escapeHtml(existing.business_name) : ''}"></div>
        <div class="field"><label>Contact Name</label><input id="cf-contact" value="${existing ? escapeHtml(existing.contact_name||'') : ''}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Phone</label><input id="cf-phone" value="${existing ? escapeHtml(existing.phone||'') : ''}"></div>
        <div class="field"><label>Email</label><input id="cf-email" value="${existing ? escapeHtml(existing.email||'') : ''}"></div>
      </div>
      <div class="field"><label>Address</label><input id="cf-address" value="${existing ? escapeHtml(existing.address||'') : ''}"></div>
      <div class="row2">
        <div class="field"><label>Price per lb ($)</label><input id="cf-price" type="number" step="0.01" value="${existing ? existing.price_per_lb : ''}"></div>
        <div class="field"><label>Order Lead Time (hours)</label><input id="cf-lead" type="number" value="${existing ? existing.lead_time_hours : 24}"></div>
      </div>

async function createPortalLogin(clientId){
  const client = (window._clientsCache || []).find(c => c.id === clientId);
  const email = document.getElementById('cf-email').value.trim();
  const password = document.getElementById('cf-portal-password').value;
  if(!email){ toast('Add a client email above and save first.', true); return; }
  if(!password || password.length < 6){ toast('Enter a password of at least 6 characters.', true); return; }
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ toast('Could not create portal login: ' + (data.msg || data.error_description || 'unknown error'), true); return; }
    const authUserId = data.id || (data.user && data.user.id);
    if(!authUserId){ toast('Account created but could not be linked automatically.', true); return; }
    await sb(`clients?id=eq.${clientId}`, { method:'PATCH', body: JSON.stringify({ auth_user_id: authUserId }) });
    toast(`Portal login created for ${email}.`);
    document.getElementById('client-form-slot').innerHTML = '';
    renderClients();
  }catch(e){ toast('Portal setup failed: ' + e.message, true); }
}

async function saveClient(id){
  const payload = {
    business_name: document.getElementById('cf-business').value.trim(),
    contact_name: document.getElementById('cf-contact').value.trim(),
    phone: document.getElementById('cf-phone').value.trim(),
    email: document.getElementById('cf-email').value.trim(),
    address: document.getElementById('cf-address').value.trim(),
    price_per_lb: parseFloat(document.getElementById('cf-price').value || 0),
    lead_time_hours: parseInt(document.getElementById('cf-lead').value || 24, 10)
  };
  if(!payload.business_name){ toast('Business name is required.', true); return; }
  try{
    if(id){
      await sb(`clients?id=eq.${id}`, { method:'PATCH', body: JSON.stringify(payload) });
    } else {
      await sb('clients', { method:'POST', body: JSON.stringify(payload) });
    }
    toast('Client saved.');
    document.getElementById('client-form-slot').innerHTML = '';
    renderClients();
  }catch(e){ toast('Save failed: ' + e.message, true); }
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function scanTicket(){
  const fileInput = document.getElementById('pf-photo');
  const statusEl = document.getElementById('pf-scan-status');
  const file = fileInput.files[0];
  if(!file){ return; }
  statusEl.textContent = 'Reading ticket…';
  try{
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';
    const session = getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/parse-pickup-ticket`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ image_base64: base64, media_type: mediaType })
    });
    const data = await res.json();
    if(!res.ok || !data.parsed){
      statusEl.textContent = "Couldn't read the ticket automatically — enter the fields manually. The photo will still be attached.";
      return;
    }
    const p = data.parsed;
    if(p.pickup_date) document.getElementById('pf-date').value = p.pickup_date;
    if(p.source) document.getElementById('pf-source').value = p.source;
    if(p.total_weight_lbs !== null && p.total_weight_lbs !== undefined) document.getElementById('pf-weight').value = p.total_weight_lbs;
    if(p.cost_total !== null && p.cost_total !== undefined) document.getElementById('pf-cost').value = p.cost_total;
    statusEl.textContent = 'Ticket read — double check the fields above before saving, handwriting isn\'t always perfect.';
  }catch(e){
    statusEl.textContent = "Couldn't reach the scanning service — enter the fields manually.";
  }
}

async function viewPickupPhoto(path){
  try{
    const session = getSession();
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/pickup-photos/${path}`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    if(!res.ok) throw new Error('Photo not found.');
    const blob = await res.blob();
    window.open(URL.createObjectURL(blob), '_blank');
  }catch(e){ toast('Could not open photo: ' + e.message, true); }
}

async function savePickup(){
  const payload = {
    pickup_date: document.getElementById('pf-date').value,
    source: document.getElementById('pf-source').value.trim(),
    total_weight_lbs: parseFloat(document.getElementById('pf-weight').value || 0),
    cost_total: parseFloat(document.getElementById('pf-cost').value || 0),
    notes: document.getElementById('pf-notes').value.trim()
  };
  const fileInput = document.getElementById('pf-photo');
  const file = fileInput.files[0];
  try{
    if(file){
      const session = getSession();
      const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
      const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/pickup-photos/${path}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${session.access_token}`,
          'Content-Type': file.type || 'application/octet-stream'
        },
        body: file
      });
      if(!uploadRes.ok){ throw new Error('Photo upload failed — pickup not saved, try again.'); }
      payload.photo_url = path;
    }
    await sb('pickups', { method:'POST', body: JSON.stringify(payload) });
    toast('Pickup logged.');
    document.getElementById('pickup-form-slot').innerHTML = '';
    renderPickups();
  }catch(e){ toast('Save failed: ' + e.message, true); }
}

  document.querySelectorAll('#sack-rows .sack-row span').forEach((s,i) => s.textContent = `Sack ${i+1}`);

function updateDeliveryTotal(){
  const price = parseFloat(document.getElementById('df-price').value || 0);
  const weights = Array.from(document.querySelectorAll('#sack-rows input')).map(i => parseFloat(i.value || 0));
  const totalWeight = weights.reduce((s,w)=>s+w,0);
  document.getElementById('df-total').textContent = `$${(totalWeight * price).toFixed(2)}`;
}

async function saveDelivery(){
  const clientId = document.getElementById('df-client').value;
  const date = document.getElementById('df-date').value;
  const price = parseFloat(document.getElementById('df-price').value || 0);
  const weights = Array.from(document.querySelectorAll('#sack-rows input')).map(i => parseFloat(i.value || 0)).filter(w => w > 0);
  if(!clientId){ toast('Choose a client.', true); return; }
  if(!weights.length){ toast('Add at least one sack weight.', true); return; }
  try{
    const [delivery] = await sb('deliveries', {
      method:'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ client_id: clientId, delivery_date: date, price_per_lb: price, status: 'delivered' })
    });
    const sackRows = weights.map((w,i) => ({ delivery_id: delivery.id, sack_number: i+1, weight_lbs: w }));
    await sb('delivery_sacks', { method:'POST', body: JSON.stringify(sackRows) });

    const totalWeight = weights.reduce((s,w)=>s+w,0);
    const totalAmount = totalWeight * price;
    const invoiceNumber = 'MB-' + Date.now().toString().slice(-8); // fallback if next_invoice_number() RPC isn't set up as a default
    await sb('invoices', {
      method:'POST',
      body: JSON.stringify({
        invoice_number: invoiceNumber,
        delivery_id: delivery.id,
        client_id: clientId,
        total_weight_lbs: totalWeight,
        price_per_lb: price,
        total_amount: totalAmount,
        status: 'unpaid'
      })
    });
    await sb(`deliveries?id=eq.${delivery.id}`, { method:'PATCH', body: JSON.stringify({ status: 'invoiced' }) });

    toast('Delivery saved and invoice generated.');
    document.getElementById('delivery-form-slot').innerHTML = '';
    renderDeliveries();
  }catch(e){ toast('Save failed: ' + e.message, true); }
}

/* ================= SCHEDULE ================= */
async function renderSchedule(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-head"><h1>Schedule</h1></div>
    <div class="page-head-bar"></div>
    <div class="stat-grid" id="inventory-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px;"><div class="empty-state">Loading…</div></div>
    <div style="font-size:12px;color:var(--water-light);margin:-14px 0 20px;">
      Est. avg weight per sack:
      <input id="avg-sack-input" type="number" step="0.5" style="width:70px;padding:3px 6px;border:1px solid var(--rope-dark);border-radius:3px;">
      lb <button class="btn small secondary" onclick="saveAvgSackWeight()">Save</button>
      — used only to estimate committed pounds against unsacked orders; doesn't affect invoices.
    </div>
    <table><thead><tr><th>Requested For</th><th>Client</th><th>Sacks</th><th>Est. lb</th><th>Notes</th><th>Status</th><th></th></tr></thead>
    <tbody id="schedule-tbody"><tr><td colspan="7">Loading…</td></tr></tbody></table>
  `;
  const [orders, clients, pickups, sacks, settings] = await Promise.all([
    sb('order_requests?select=*&order=requested_date.asc'),
    sb('clients?select=id,business_name'),
    sb('pickups?select=total_weight_lbs'),
    sb('delivery_sacks?select=weight_lbs'),
    sb('app_settings?select=*')
  ]);

  const avgSackWeight = Number((settings.find(s => s.key === 'avg_sack_weight_lbs') || {}).value || 35);
  document.getElementById('avg-sack-input').value = avgSackWeight;

  const totalPickedUp = pickups.reduce((s,p)=>s+Number(p.total_weight_lbs),0);
  const totalDelivered = sacks.reduce((s,x)=>s+Number(x.weight_lbs),0);
  const onHand = totalPickedUp - totalDelivered;
  const committedLbs = orders.filter(o => o.status === 'pending' || o.status === 'confirmed')
    .reduce((s,o)=>s + (o.requested_sacks * avgSackWeight), 0);
  const availableToPromise = onHand - committedLbs;

  document.getElementById('inventory-grid').innerHTML = `
    <div class="stat-card"><div class="label">On Hand</div><div class="value">${onHand.toLocaleString(undefined,{maximumFractionDigits:0})} lb</div></div>
    <div class="stat-card"><div class="label">Committed (Pending + Confirmed)</div><div class="value" style="color:var(--water);">${committedLbs.toLocaleString(undefined,{maximumFractionDigits:0})} lb</div></div>
    <div class="stat-card" style="${availableToPromise < 0 ? 'border-color:var(--unpaid);border-width:2px;' : ''}">
      <div class="label">Available to Promise</div>
      <div class="value" style="${availableToPromise < 0 ? 'color:var(--unpaid);' : ''}">${availableToPromise.toLocaleString(undefined,{maximumFractionDigits:0})} lb</div>
    </div>
  `;

  const tbody = document.getElementById('schedule-tbody');
  if(!orders.length){ tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">No order requests yet. Once clients start ordering through the portal, they'll show up here.</div></td></tr>`; return; }
  tbody.innerHTML = orders.map(o => {
    const client = clients.find(c => c.id === o.client_id);
    const estLb = o.requested_sacks * avgSackWeight;
    return `<tr>
      <td>${o.requested_date}</td>
      <td>${client ? escapeHtml(client.business_name) : 'Unknown'}</td>
      <td>${o.requested_sacks}</td>
      <td>${estLb.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
      <td>${escapeHtml(o.notes || '—')}</td>
      <td>
        <select onchange="updateOrderStatus('${o.id}', this.value)">
          <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
          <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
          <option value="fulfilled" ${o.status==='fulfilled'?'selected':''}>Fulfilled</option>
          <option value="declined" ${o.status==='declined'?'selected':''}>Declined</option>
        </select>
      </td>
      <td>${o.status === 'pending' ? `<button class="btn small" onclick="updateOrderStatus('${o.id}', 'confirmed')">Confirm</button>` : ''}</td>
    </tr>`;
  }).join('');
}

async function saveAvgSackWeight(){
  const val = parseFloat(document.getElementById('avg-sack-input').value || 35);
  try{
    await sb('app_settings?key=eq.avg_sack_weight_lbs', { method:'PATCH', body: JSON.stringify({ value: String(val) }) });
    toast('Saved.');
    renderSchedule();
  }catch(e){ toast('Save failed: ' + e.message, true); }
}

async function updateOrderStatus(id, status){
  try{
    await sb(`order_requests?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ status }) });
    toast(status === 'confirmed' ? 'Order confirmed — client will see this reflected.' : 'Order updated.');
    renderSchedule();
    refreshScheduleBadge();
  }catch(e){ toast('Update failed: ' + e.message, true); }
}


/* ================= UTIL ================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* wire up initial nav + login enter key */
document.getElementById('login-password').addEventListener('keydown', e => { if(e.key === 'Enter') handleLogin(); });
document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', () => {}));
boot();
</script>
